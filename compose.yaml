services:
  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE:-zabbix/zabbix-server-pgsql:ubuntu-7.4-latest}
    restart: unless-stopped
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-zabbix}
      POSTGRES_DB: ${POSTGRES_DB-zabbix}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network-zabbix

  zabbix-frontend:
    image: ${ZABBIX_FRONTEND_IMAGE:-zabbix/zabbix-web-nginx-pgsql:ubuntu-7.4-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-zabbix}
      POSTGRES_DB: ${POSTGRES_DB-zabbix}
      PHP_TZ: ${TZ}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
    depends_on:
      - zabbix-server
    networks:
      - network-zabbix

  zabbix-agent:
    image: ${ZABBIX_AGENT_IMAGE:-zabbix/zabbix-agent2:ubuntu-7.4-latest}
    restart: unless-stopped
    ports:
      - "10050:10050"
    environment:
      ZBX_ACTIVE_ALLOW: false
      TZ: ${TZ}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_HOSTNAME: zabbix-agent
      ZBX_HOSTNAMEITEM: system.hostname
    depends_on:
      - zabbix-server
    networks:
      - network-zabbix

  # One-shot: repoints the bundled "Zabbix server" host from 127.0.0.1 to the
  # agent container's DNS name, then exits. Safe to re-run; see the script.
  zabbix-init:
    image: ${INIT_IMAGE:-python:3.13-alpine}
    restart: "no"
    environment:
      ZBX_API_URL: http://zabbix-frontend:8080/api_jsonrpc.php
      ZABBIX_API_USER: ${ZABBIX_API_USER:-Admin}
      ZABBIX_API_PASSWORD: ${ZABBIX_API_PASSWORD:-zabbix}
      ZBX_INIT_DNS: zabbix-agent
    volumes:
      - ./scripts/init-zabbix-host.py:/init-zabbix-host.py:ro
    command: ["python3", "/init-zabbix-host.py"]
    depends_on:
      zabbix-frontend:
        condition: service_healthy
    networks:
      - network-zabbix

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:latest}
    # command: -c ssl=on -c ssl_cert_file=/run/secrets/server-cert.pem -c ssl_key_file=/run/secrets/server-key.pem -c ssl_ca_file=/run/secrets/root-ca.pem
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      # - pgsql_socket:/var/run/postgresql/
    environment:
      POSTGRES_USER: ${POSTGRES_USER-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-zabbix}
      POSTGRES_DB: ${POSTGRES_DB-zabbix}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-zabbix

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SECRET:-12345}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
      # Consumed by grafana/provisioning/datasources/datasource.yml
      ZABBIX_API_USER: ${ZABBIX_API_USER:-Admin}
      ZABBIX_API_PASSWORD: ${ZABBIX_API_PASSWORD:-zabbix}
      TZ: ${TZ}
    user: "472"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - zabbix-frontend
    networks:
      - network-zabbix

volumes:
  postgres: {}
  grafana: {}

networks:
  network-zabbix:
    driver: bridge