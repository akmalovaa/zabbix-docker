apiVersion: 1

datasources:
  - name: zabbix
    type: alexanderzobnin-zabbix-datasource
    # Pinned so provisioned dashboards can reference the datasource by a stable uid.
    uid: zabbix
    access: proxy
    url: http://zabbix-frontend:8080/api_jsonrpc.php
    isDefault: true
    jsonData:
      username: $ZABBIX_API_USER
      trends: true
      trendsFrom: "7d"
      trendsRange: "4d"
    secureJsonData:
      password: $ZABBIX_API_PASSWORD
